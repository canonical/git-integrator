[tox]
no_package = True
skip_missing_interpreters = True
env_list = format, lint, lock
min_version = 4.0.0

[vars]
src_path = {tox_root}/src
all_path = {[vars]src_path}

[testenv]
allowlist_externals = uv
set_env =
    PYTHONPATH = {tox_root}/lib:{[vars]src_path}
    PYTHONBREAKPOINT=pdb.set_trace
    PY_COLORS=1
pass_env =
    PYTHONPATH
    CHARM_BUILD_DIR
    MODEL_SETTINGS

[testenv:lock]
description = Update uv.lock with the latest deps
commands =
  uv lock --upgrade --no-cache

[testenv:format]
description = Apply coding style standards to code
dependency_groups =
    format
commands =
    uv tool run ruff format {[vars]all_path}
    uv tool run ruff check --fix {[vars]all_path}

[testenv:lint]
description = Check code against coding style standards, and static checks
dependency_groups =
    lint
commands =
    uv tool run codespell {tox_root}
    uv tool run ruff check {[vars]all_path}
    uv tool run ruff format --check --diff {[vars]all_path}
