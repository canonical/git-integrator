# This file configures Charmcraft.
# See https://documentation.ubuntu.com/charmcraft/stable/reference/files/charmcraft-yaml-file/
type: charm
name: git-integrator
title: Git Integrator
summary: A provider charm for git credentials.
description: |
  Git Integrator is an integrator charm for specifying and managing git credentials
  to consumer charms. Store the credentials centrally in the integrator charm and
  relate consumer charms as needed.

# Documentation:
# https://documentation.ubuntu.com/charmcraft/stable/howto/build-guides/select-platforms/
base: ubuntu@24.04
platforms:
  amd64:

parts:
  charm:
    plugin: uv
    source: .
    build-snaps:
      - astral-uv
  files:
    plugin: dump
    source: .
    stage:
      - LICENSE
